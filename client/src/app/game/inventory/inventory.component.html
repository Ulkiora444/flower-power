<section class="panel">
  <div class="section-heading">
    <div>
      <span>Склад</span>
      <h2>Инвентарь</h2>
    </div>
  </div>

  <div class="inventory-block">
    <h3>Семена</h3>
    <article class="inventory-row" *ngFor="let item of inventory.seeds; trackBy: trackBySeedRarity">
      <div class="item-main">
        <span class="item-icon seed-item-icon">
          <img [src]="seedIconUrl(item.rarity)" [alt]="item.label" loading="lazy">
        </span>
        <div>
          <strong>{{ item.label }}</strong>
          <small>{{ item.quantity }} шт.</small>
        </div>
      </div>
      <div class="sell-controls">
        <input #seedQty type="number" min="1" [max]="item.quantity" value="1" aria-label="Количество семян">
        <input #seedPrice type="number" min="1" [value]="suggestSeedPrice(item)" aria-label="Цена семени">
        <button type="button" (click)="submitSeed(item, seedQty.value, seedPrice.value)" [disabled]="busy">
          На рынок
        </button>
      </div>
    </article>
    <p class="empty" *ngIf="inventory.seeds.length === 0">Семян нет. Заберите недельный бонус или купите у игроков.</p>
  </div>

  <div class="inventory-block">
    <h3>Цветы</h3>
    <article class="inventory-row" *ngFor="let item of inventory.flowers; trackBy: trackBySpeciesId">
      <div class="item-main">
        <span class="item-icon" [style.color]="item.species.color">{{ item.species.emoji }}</span>
        <div>
          <strong>{{ item.species.name }}</strong>
          <small>{{ item.quantity }} шт.</small>
        </div>
      </div>
      <div class="sell-controls">
        <input #flowerQty type="number" min="1" [max]="item.quantity" value="1" aria-label="Количество цветов">
        <input #flowerPrice type="number" min="1" [value]="suggestFlowerPrice(item)" aria-label="Цена цветка">
        <button type="button" (click)="submitFlower(item, flowerQty.value, flowerPrice.value)" [disabled]="busy">
          На рынок
        </button>
      </div>
    </article>
    <p class="empty" *ngIf="inventory.flowers.length === 0">Купленные цветы появятся здесь. Свои зрелые цветы продаются прямо из горшка.</p>
  </div>
</section>
